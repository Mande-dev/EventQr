<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/logo-eventqr.svg"
    />
    <link
      rel="apple-touch-icon"
      href="/images/logo-eventqr.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Primary Meta Tags -->
    <title>EventQR</title>
    <meta name="title" content="EventQR" />
    <meta
      name="description"
      content="EventQR — gestion d'événements, invitations QR et contrôle des présences."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EventQR" />
    <meta
      property="og:description"
      content="EventQR — gestion d'événements, invitations QR et contrôle des présences."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="EventQR" />
    <meta
      property="twitter:description"
      content="EventQR — gestion d'événements, invitations QR et contrôle des présences."
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#0A4B7A" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
