<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="eventqr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A4B7A"/>
      <stop offset="55%" stop-color="#1A6FA0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Icône -->
  <g transform="translate(25 20)">
    <rect x="20" y="20" width="125" height="145" rx="24"
          transform="rotate(-10 82 92)"
          fill="url(#eventqr)"/>

    <!-- QR Code stylisé -->
    <g fill="#FFFFFF">
      <rect x="48" y="55" width="32" height="32" rx="4"/>
      <rect x="55" y="62" width="18" height="18" fill="#0A4B7A"/>

      <rect x="91" y="55" width="32" height="32" rx="4"/>
      <rect x="98" y="62" width="18" height="18" fill="#1A6FA0"/>

      <rect x="48" y="98" width="32" height="32" rx="4"/>
      <rect x="55" y="105" width="18" height="18" fill="#0A4B7A"/>

      <rect x="94" y="100" width="12" height="12"/>
      <rect x="111" y="100" width="12" height="12"/>
      <rect x="94" y="117" width="12" height="12"/>
      <rect x="111" y="117" width="12" height="12"/>
    </g>

    <!-- Anneau -->
    <path d="M8 128 C35 185 118 195 160 142"
          fill="none"
          stroke="#10B981"
          stroke-width="10"
          stroke-linecap="round"/>
  </g>

  <!-- Nom -->
  <text x="190" y="125"
        font-family="Inter, Arial, sans-serif"
        font-size="72"
        font-weight="800"
        fill="#07385B">
    Event<tspan fill="#1A6FA0">Q</tspan><tspan fill="#10B981">R</tspan>
  </text>
</svg>